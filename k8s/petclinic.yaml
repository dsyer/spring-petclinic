# A minimal kubernetes PetClinic with bindings to a local database via a secret. Use this if you don't use TAP and the workload.
apiVersion: v1
kind: Service
metadata:
  name: petclinic
spec:
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: petclinic

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  labels:
    app: petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
    spec:
      containers:
        - name: workload
          image: dsyer/petclinic
          env:
          # tell the workload to use mysql instead of the default embedded database
          - name: SPRING_PROFILES_ACTIVE
            value: mysql
          - name: SERVICE_BINDING_ROOT
            value: /bindings
          - name: SPRING_APPLICATION_JSON
            value: |
              {
                "management.endpoint.health.probes.add-additional-paths": true
              }
          ports:
          - name: http
            containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
          - mountPath: /bindings/secret
            name: binding
            readOnly: true
      volumes:
      - name: binding
        projected:
          sources:
          - secret:
              name: demo-db
