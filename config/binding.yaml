# Note: this is not needed if the workflow has a serviceClaim
apiVersion: servicebinding.io/v1beta1
kind: ServiceBinding
metadata:
  name: petclinic-secret
  annotations:
    kapp.k14s.io/change-group: binding
spec:
  # direct Secret reference is used for compatibility, but not recommended for dynamically provisioned services
  service:
    apiVersion: v1
    kind: Secret
    name: spring-petclinic-db
  workload:
    apiVersion: serving.knative.dev/v1
    kind: Service
    name: petclinic